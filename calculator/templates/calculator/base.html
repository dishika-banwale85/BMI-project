<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Health & BMI Portal{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gradient-to-br from-black via-slate-900 to-blue-950 min-h-screen text-gray-200 font-sans antialiased">

    <nav class="bg-white/5 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-white">
                ❤️ VitalityHub
            </a>
           <div class="space-x-6 text-sm font-semibold flex items-center">
                <a href="{% url 'home' %}" class="hover:text-blue-400 transition-colors">Home</a>
                <a href="{% url 'about' %}" class="hover:text-blue-400 transition-colors">About Health</a>
                <a href="{% url 'specialists' %}" class="hover:text-blue-400 transition-colors">Diet Specialists</a>
                <a href="{% url 'chat_view' %}" class="text-emerald-400 hover:text-emerald-300 transition-colors">AI Assistant</a>
                <a href="{% url 'calculator' %}" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg transition-all shadow-[0_0_15px_rgba(37,99,235,0.4)]">
                    Run App
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 md:p-12">
        {% block content %}{% endblock %}
    </main>
    

</body>
</html>
